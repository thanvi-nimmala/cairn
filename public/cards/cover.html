<!doctype html><html><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
<style>
  body{margin:0;padding:0;width:1676px;height:940px;overflow:hidden;
    background:
      radial-gradient(70% 90% at 76% 18%, rgba(143,178,206,.34), transparent 66%),
      radial-gradient(60% 70% at 10% 94%, rgba(96,120,150,.3), transparent 72%),
      linear-gradient(158deg,#2E3744 0%,#242B36 54%,#191E26 100%);
    display:flex;align-items:center;gap:0}
  .left{flex:1;padding:0 0 0 110px;display:flex;flex-direction:column;gap:30px}
  .wm{display:flex;align-items:flex-end;gap:22px}
  .wm .nm{font:700 52px/1 'Manrope',sans-serif;color:#E8EEF4;letter-spacing:-.035em}
  .tag{font:500 24px/1.45 'Manrope',sans-serif;color:#A9B6C2;max-width:19ch}
  .meta{font:600 12px/1 'Martian Mono',monospace;color:#76838F;letter-spacing:.16em}
  .right{width:760px;height:940px;position:relative;display:grid;place-items:center}
  .keystone-mark g{animation:none !important}
  .right img{height:968px;width:auto;display:block;filter:drop-shadow(0 50px 90px rgba(0,0,0,.5))}
</style></head><body>
  <div class="left">
    <div class="meta">FINTECH CONCEPT &middot; iOS</div>
    <div class="wm"><span data-art="mark:86"></span><span class="nm">Keystone</span></div>
    <div class="tag">A fraud model that shows its working.</div>
  </div>
  <div class="right"><img src="./cover-screen.png" alt="" /></div>
<script src="./art.js"></script>
</body></html>
